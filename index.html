<html>
    <head>
        <style>
            form{
                background-color: rgb(112, 85, 26);
                border:2px;
                border-style:dotted;
                width: 200px;
                height: 150px;
                padding: 35px;
                padding-top: 25px;
                padding-bottom: 120px;
                box-shadow: 0 0 25px rgb(226, 210, 136);
                opacity: 0.8;
          
                
                
            }
            body{
                padding-top: 140px;
                background-color: rgb(7, 7, 7);
                background-image: url("image1.jpg");
            }
           input{
            box-sizing: border-box;
            background-color: rgb(143, 200, 204);
            border: 1px solid rgb(206, 188, 131);
            box-shadow: 0 0 7px rgb(17, 14, 4);
           }
        </style>
        <script>
            function validateForm()
            {
                let username = document.getElementById("username").value;
                let password = document.getElementById("password").value;

                if (username == "") {
                    alert("Please enter your username");
                    return false;
                }

                if (password == "") {
                    alert("Please enter your password");
                    return false;
                }

                alert("Login successful!");
                return true;
            }
        </script>
    </head>
    <body>
        <center>
        
        <form action="Login.html"  onsubmit="return validateForm();" style="background-color: #19171b;">
            <h2 style="text-shadow:2px 2px 2px rgb(17, 17, 16);  font-size: 34px; color: rgb(231, 234, 235);"><u>Login</u></h2>
      
            <input type="text" id="username" placeholder="Username" name="username" ><br>
               <br>
            <input type="password" id="password"  placeholder="Password" name="password" ><br><br><br>
            <input type="submit" value="Login" style="background-color: rgb(141, 125, 71);"><br>
            <br>
            <a href="Login.html" style="text-decoration: none; color: rgb(231, 234, 235);">Register Here</a>
            </form>
            
          
  </center>
    </body>
</html>
